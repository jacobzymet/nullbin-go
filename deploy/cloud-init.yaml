#cloud-config
# Nullbin on a fresh Ubuntu 24.04 cloud VM, with automatic HTTPS.
#
# 1. Point your domain's DNS A record (and AAAA, if the VM has IPv6) at the
#    VM's public IP address.
# 2. Edit DOMAIN (and MAX_SIZE if you like) in the block below.
# 3. Paste this whole file into the "User data" / "Cloud-init" field when
#    creating the VM (AWS, Google Cloud, Azure, DigitalOcean, Hetzner,
#    Linode, Vultr, Oracle Cloud, ...). Give it at least 1 GB of RAM.
#
# On first boot it: applies updates, turns on the firewall (SSH, 80, 443
# only), installs Docker from Ubuntu's signed archive, downloads the latest
# Nullbin release (never the unstable main branch) into /opt/nullbin, builds
# it from source and starts it with Caddy. Progress is logged to
# /var/log/cloud-init-output.log; the site is up a few minutes after boot.

write_files:
  # -------------------------- edit this block: DOMAIN=paste.example.com --
  - path: /opt/nullbin-settings.env
    permissions: "0600"
    content: |
      DOMAIN=
      MAX_SIZE=100MiB
  # ---------------------------------------------------------------------------
  # SSH: keys only, and no root login, whatever the image's defaults. Files
  # in sshd_config.d are read in order and the first value wins, so this
  # comes before the image's own settings.
  - path: /etc/ssh/sshd_config.d/10-nullbin.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

# SSH: keys only, never passwords, and no direct root login.
ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - curl
  - ufw
  - unattended-upgrades

runcmd:
  # Apply the SSH settings above, only if the configuration is valid.
  - [sh, -euc, "sshd -t && (systemctl reload ssh || systemctl restart ssh)"]
  - [sh, -euc, "ufw default deny incoming && ufw default allow outgoing && ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable"]
  - [systemctl, enable, --now, docker]
  - |
    set -eu
    version=$(curl -fsSL https://api.github.com/repos/jacobzymet/nullbin-go/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
    test -n "$version"
    printf "%s" "$version" | grep -Eqx "v[0-9]+[.][0-9]+[.][0-9]+" || { echo "nullbin: could not look up the latest release" >&2; exit 1; }
    git clone --branch "$version" https://github.com/jacobzymet/nullbin-go.git /opt/nullbin
  - [install, -m, "0600", /opt/nullbin-settings.env, /opt/nullbin/deploy/.env]
  - [/opt/nullbin/deploy/nullbin, start]
