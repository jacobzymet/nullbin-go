# Option B: only the API and its HTTPS proxy run on this server.
# The frontend is hosted independently. See README.md, Option B.
#
#   sudo ./nullbin setup-api api.example.com https://paste.example.com
#   sudo ./nullbin start            (later: sudo ./nullbin update; see ./nullbin help)
#
name: nullbin

services:
  nullbin:
    # Built from this checkout.
    image: nullbin-api:local
    build:
      context: ..
      target: backend
      args:
        VERSION: ${VERSION:-self-built}
      # Lets "./nullbin status" report the version that is actually running.
      labels:
        org.opencontainers.image.version: ${VERSION:-self-built}
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Process limit (threads count). Generous for full load; stops a runaway.
    pids_limit: 2048
    environment:
      NULLBIN_API_ONLY: "true"
      NULLBIN_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in deploy/.env.api}
      NULLBIN_BEHIND_HTTPS: "true"
      # Only Caddy (fixed address below) can reach Nullbin, so only its
      # X-Forwarded-For is trusted. Rate limits then see real client IPs.
      NULLBIN_TRUSTED_PROXIES: "172.30.53.10"
      NULLBIN_MAX_SIZE: ${MAX_SIZE:-100MiB}
      NULLBIN_MAX_STORAGE: ${MAX_STORAGE:-10GiB}
      NULLBIN_MAX_PENDING: ${MAX_PENDING:-1024}
    volumes:
      - nullbin-data:/data
    networks:
      backend:
        ipv4_address: 172.30.53.20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    # Caddy without a shell or tools, as a non-root user (Dockerfile, proxy).
    image: nullbin-proxy:local
    build:
      context: ..
      target: proxy
    restart: unless-stopped
    depends_on:
      nullbin:
        condition: service_healthy
    # Non-root with no capabilities; this lets it bind ports 80 and 443.
    user: "65532:65532"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    environment:
      DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env.api}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.api:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    tmpfs:
      - /tmp
    networks:
      frontend: {}
      backend:
        ipv4_address: 172.30.53.10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # IPv6 here lets Docker forward IPv6 visitors directly, so each keeps its
  # own address and rate limits. Without it Docker relays them through a
  # proxy and they all appear to come from one internal address. ./nullbin
  # turns it off on servers whose kernel has IPv6 disabled.
  frontend:
    enable_ipv6: ${NULLBIN_IPV6:-true}
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.53.0/24

volumes:
  nullbin-data:
  # Caddy's certificates and state.
  proxy-data:
  proxy-config:
