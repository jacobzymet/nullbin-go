name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  STATICCHECK_VERSION: "v0.8.2"
  GOVULNCHECK_VERSION: "v1.9.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  go:
    name: Go (fmt, vet, staticcheck, test -race, govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: go test -race
        run: |
          go test -race -count=1 ./...
          go test -tags=api -race -count=1 ./...
      - name: Fuzz (short run per target)
        run: |
          go test -run='^$' -fuzz='^FuzzValidID$' -fuzztime=15s ./internal/storage
          for f in FuzzParseChunkIndex FuzzClientIP FuzzHandler; do
            go test -run='^$' -fuzz="^${f}\$" -fuzztime=15s ./internal/server
          done
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  web:
    name: Frontend (npm ci, audit, typecheck, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm ci
        run: npm ci --ignore-scripts
      - name: npm audit
        run: npm audit --audit-level=low
      - name: npm audit signatures
        run: npm audit signatures
      - name: typecheck
        run: npm run typecheck
      - name: unit tests (crypto, UI helpers)
        run: npm test
      - name: build bundles
        run: npm run build

  browser:
    name: Browser (${{ matrix.mode }}, CSP and all features)
    strategy:
      fail-fast: false
      matrix:
        mode: [combined, split]
    env:
      NB_TEST_SPLIT: ${{ matrix.mode == 'split' && '1' || '0' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: npm ci
        run: npm ci --ignore-scripts
      - name: build bundles and binary
        run: |
          npm run build
          if [ "$NB_TEST_SPLIT" = 1 ]; then
            go build -tags=api -trimpath -o "$RUNNER_TEMP/nullbin" ./cmd/nullbin
          else
            go build -trimpath -o "$RUNNER_TEMP/nullbin" ./cmd/nullbin
          fi
      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners.
      - name: browser test
        run: |
          NB_TEST_BINARY="$RUNNER_TEMP/nullbin" CHROME_PATH="$(command -v google-chrome)" npm run test:browser

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The MIT-licensed gitleaks binary, pinned by version and SHA-256.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 .'

  docker:
    name: Docker build and hardened smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build
        run: docker build --build-arg VERSION=ci -t nullbin:ci .
      - name: run read-only, non-root, no capabilities
        run: |
          docker run -d --name nullbin --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 nullbin:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/v1/version && break; sleep 1; done
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          grep -qi "^content-security-policy: default-src 'none'" headers.txt
          test "$(docker inspect nullbin --format '{{.Config.User}}')" = "65532:65532"
          docker logs nullbin
          docker rm -f nullbin

  reproducible:
    name: Reproducible build (Docker vs native, different directory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build A (Dockerfile, as releases are built)
        run: docker build --no-cache --target artifacts --build-arg VERSION=repro --output "type=local,dest=$RUNNER_TEMP/a" .
      - name: Build B (native toolchain, another directory)
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere/src" "$RUNNER_TEMP/b/dist"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/elsewhere/src"
          cd "$RUNNER_TEMP/elsewhere/src"
          npm ci --ignore-scripts --no-audit --no-fund
          NULLBIN_VERSION=repro npm run build
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X main.version=repro" \
            -o "$RUNNER_TEMP/b/nullbin" ./cmd/nullbin
          cp internal/assets/dist/app.js internal/assets/dist/app.css internal/assets/dist/index.html "$RUNNER_TEMP/b/dist/"
      - name: Compare
        run: |
          cd "$RUNNER_TEMP"
          (cd a && sha256sum nullbin dist/app.js dist/app.css dist/index.html) | tee a.sha256
          (cd b && sha256sum nullbin dist/app.js dist/app.css dist/index.html) > b.sha256
          diff a.sha256 b.sha256

  deploy-bundle:
    name: Deploy bundle (Caddy + HTTPS) smoke test
    # Runs the helper script as root on the runner: not for pull requests
    # from forks, whose code a maintainer has not reviewed yet.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start deploy/compose.yaml exactly as a user would (DOMAIN=localhost)
        working-directory: deploy
        run: |
          # A link planted in the checkout must not make root read or change a
          # system file: setup fails cleanly and writes nothing.
          mv env.example env.example.real && ln -s /etc/shadow env.example
          if sudo ./nullbin setup localhost; then exit 1; fi
          test ! -e .env
          if ls -a | grep -q '^[.]config'; then exit 1; fi
          rm env.example && mv env.example.real env.example
          sudo ./nullbin setup localhost
          # The configuration is the runner's, private, and root left nothing behind.
          test "$(stat -c '%U %a' .env)" = "$(id -un) 600"
          test -z "$(find .. -user root -print -quit)"
          # Start the way servers set up before v0.2.5 ran: no IPv6 on the
          # public network and the old MAX_PENDING default. The update step
          # below must change both.
          sed -i 's/^MAX_PENDING=1024$/MAX_PENDING=64/' .env
          NULLBIN_IPV6=false VERSION=v0.0.0-ci docker compose up -d --build --wait --wait-timeout 300
          test "$(docker network inspect nullbin_frontend --format '{{.EnableIPv6}}')" = false
      - name: Lint the nullbin helper script
        run: shellcheck deploy/nullbin
      - name: Operators can remove a reported paste by ID
        working-directory: deploy
        run: |
          set -x
          created=$(curl -fsSk -H 'Content-Type: application/json'             -d '{"expires_in":300,"burn_after_reading":false,"total_size":100}' https://localhost/api/v1/pastes)
          id=$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          token=$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_token"])')
          head -c 100 /dev/urandom > blob.bin
          curl -fsSk -X PUT -H 'Content-Type: application/octet-stream' -H "Nullbin-Upload-Token: $token"             --data-binary @blob.bin "https://localhost/api/v1/pastes/$id/chunks/0"
          curl -fsSk -X POST -H "Nullbin-Upload-Token: $token" "https://localhost/api/v1/pastes/$id/finalize"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost/api/v1/pastes/$id")" = 200
          # The command from the README.
          sudo ./nullbin delete "$id" | tee delete.txt
          grep -q Deleted delete.txt
          for i in $(seq 1 30); do
            [ "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/v1/version)" = 200 ] && break
            sleep 2
          done
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost/api/v1/pastes/$id")" = 404
      - name: HTTPS, headers, redirect, isolation, rate limits
        run: |
          set -x
          curl -fsSk -D headers.txt -o /dev/null https://localhost/
          grep -qi "^content-security-policy: default-src 'none'" headers.txt
          grep -qi '^strict-transport-security: max-age=31536000' headers.txt
          if grep -qi '^server:' headers.txt; then echo 'Server header leaked'; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          # Nullbin itself is not reachable from the host.
          if curl -s -m 3 http://127.0.0.1:8080/; then echo 'nullbin is reachable directly'; exit 1; fi
          test "$(docker inspect nullbin-nullbin-1 --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}}')" = "65532:65532 true"
          # The internet-facing proxy: non-root, read-only, no added capabilities,
          # no shell, and no HTTP/3.
          test "$(docker inspect nullbin-caddy-1 --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapAdd}}')" = "65532:65532 true []"
          if docker exec nullbin-caddy-1 sh -c true 2>/dev/null; then echo 'the proxy has a shell'; exit 1; fi
          if grep -qi '^alt-svc:' headers.txt; then echo 'HTTP/3 is advertised'; exit 1; fi
          test "$(docker network inspect nullbin_backend --format '{{.Internal}}')" = true
          # Spoofed X-Forwarded-For through Caddy must not get past the limit.
          codes=""
          for i in $(seq 1 30); do
            codes="$codes $(curl -sk -o /dev/null -w '%{http_code}' -H "X-Forwarded-For: 10.9.$i.1" \
              -H 'Content-Type: application/json' \
              -d '{"expires_in":300,"burn_after_reading":false,"total_size":100}' https://localhost/api/v1/pastes)"
          done
          echo "$codes" | grep -q 429
      - name: Frontend stays independent of the API
        working-directory: deploy
        run: |
          curl -fsSk https://localhost/ -o frontend-before.html
          curl -fsSk https://localhost/version.json -o frontend-version.json
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          data = json.loads(Path('frontend-version.json').read_text())
          assert data['api_origin'] == 'same-origin'
          # The page and its manifest name the version it was built from.
          assert data['version'] == 'v0.0.0-ci', data
          assert '>Nullbin v0.0.0-ci<' in Path('frontend-before.html').read_text()
          assert hashlib.sha256(Path('frontend-before.html').read_bytes()).hexdigest() == data['html_sha256']
          Path('asset-path.txt').write_text(data['js'])
          PY
          asset=$(cat asset-path.txt)
          curl -fsSk -D asset-headers.txt "https://localhost$asset" -o /dev/null
          grep -qi '^cache-control: public, max-age=31536000, immutable' asset-headers.txt
          curl -fsSk https://localhost/api/v1/version | grep -q '"mode":"api"'
          # The version passed at build time is what the footer link reports.
          curl -fsSk https://localhost/api/v1/version | grep -q '"version":"v0.0.0-ci"'
          # The API container has no frontend or host mounts to change.
          test "$(docker inspect nullbin-nullbin-1 --format '{{len .Mounts}}')" = 1
          docker compose stop nullbin
          curl -fsSk https://localhost/ -o frontend-after.html
          cmp frontend-before.html frontend-after.html
          curl -fsSk https://localhost/p/0123456789abcdef0123456789abcdef -o frontend-view.html
          cmp frontend-before.html frontend-view.html
      - name: Proxy errors do not log request identifiers or capability tokens
        working-directory: deploy
        run: |
          docker compose stop nullbin
          status=$(curl -sk -o /dev/null -w '%{http_code}' -X POST \
            -H 'Nullbin-Upload-Token: audit-upload-sentinel' \
            -H 'Nullbin-Delete-Token: audit-delete-sentinel' \
            -H 'Nullbin-Burn-Token: audit-burn-sentinel' \
            -H 'Nullbin-Comment-Token: audit-comment-sentinel' \
            -H 'User-Agent: audit-agent-sentinel' \
            'https://localhost/api/v1/pastes/0123456789abcdef0123456789abcdef/read')
          test "$status" = 502
          # Failed TLS handshakes (a wrong server name, plain HTTP on 443) carry
          # the client address; at the default level they must not be logged.
          curl -sk --max-time 5 --resolve nope.invalid:443:127.0.0.1 https://nope.invalid/ -o /dev/null || true
          curl -s --max-time 5 http://127.0.0.1:443/ -o /dev/null || true
          docker logs nullbin-caddy-1 > caddy-errors.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('caddy-errors.log').read_text()
          for marker in ('audit-upload-sentinel', 'audit-delete-sentinel', 'audit-burn-sentinel',
                         'audit-comment-sentinel', 'audit-agent-sentinel', '0123456789abcdef0123456789abcdef'):
              assert marker not in raw, 'request data leaked into proxy logs'
          for marker in ('handshake error from', '"remote"', '"remote_ip"', '"client_ip"', 'RemoteAddr'):
              assert marker not in raw, 'a client address leaked into proxy logs: ' + marker
          entries = []
          for line in raw.splitlines():
              try:
                  entries.append(json.loads(line))
              except ValueError:
                  pass
          errors = [e for e in entries if e.get('logger', '').startswith('http.log.error') and e.get('status') == 502]
          assert errors, 'the failure must retain a useful, redacted error log'
          assert all('request' not in e and 'resp_headers' not in e for e in errors)
          PY
      - name: A hostile API cannot serve executable frontend pages
        working-directory: deploy
        run: |
          mkdir -p "$RUNNER_TEMP/hostile-api"
          cat > "$RUNNER_TEMP/hostile-api/Caddyfile" <<'CADDY'
          :8080 {
            header Content-Type text/html
            header Content-Security-Policy "script-src * 'unsafe-inline'"
            header Set-Cookie "api-control=bad; Path=/"
            header Service-Worker-Allowed /
            respond "<script>window.apiControlled=true</script>" 200
          }
          CADDY
          docker compose rm -f nullbin
          docker run -d --name hostile-api --network nullbin_backend --ip 172.30.53.20 \
            -v "$RUNNER_TEMP/hostile-api/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy "$(docker compose images -q caddy)" \
            run --config /etc/caddy/Caddyfile --adapter caddyfile
          for i in $(seq 1 20); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/v1/version)
            if [ "$status" = 200 ]; then break; fi
            sleep 1
          done
          curl -fsSk -D hostile-headers.txt https://localhost/api/v1/version -o hostile-body.txt
          grep -q apiControlled hostile-body.txt
          grep -qi "^content-security-policy: default-src 'none';.*sandbox" hostile-headers.txt
          if grep -Eqi '^(set-cookie|service-worker-allowed):' hostile-headers.txt; then exit 1; fi
          curl -fsSk https://localhost/ -o frontend-hostile-api.html
          cmp frontend-before.html frontend-hostile-api.html
          docker rm -f hostile-api
      - name: The nullbin script installs a release and reports it
        working-directory: deploy
        run: |
          set -x
          # A local release tag on this commit; CI cannot fetch the real ones
          # while the repository is private.
          git tag v9.9.9
          # Earlier steps left scratch files in the checkout; a server's has none.
          git -C .. clean -fdq
          # Only published releases on main are installed; this tag is neither.
          if sudo ./nullbin update v9.9.9; then exit 1; fi
          # Files the release did not bring would be built in, so update
          # refuses: an added file, and an ignored file in a folder the
          # build copies.
          touch ../internal/server/zz_added.go
          if sudo NULLBIN_TEST_UNRELEASED=1 ./nullbin update v9.9.9; then exit 1; fi
          rm ../internal/server/zz_added.go
          touch ../internal/server/coverage.out
          if sudo NULLBIN_TEST_UNRELEASED=1 ./nullbin update v9.9.9; then exit 1; fi
          rm ../internal/server/coverage.out
          sudo NULLBIN_TEST_UNRELEASED=1 ./nullbin update v9.9.9 | tee "$RUNNER_TEMP/update.txt"
          grep -q 'Nullbin v9.9.9 is running' "$RUNNER_TEMP/update.txt"
          curl -fsSk https://localhost/api/v1/version | grep -q '"version":"v9.9.9"'
          curl -fsSk https://localhost/ | grep -q '>Nullbin v9.9.9<'
          sudo ./nullbin status | tee "$RUNNER_TEMP/status.txt"
          grep -q 'Running version:   v9.9.9' "$RUNNER_TEMP/status.txt"
          grep -q 'Checked-out code:  v9.9.9' "$RUNNER_TEMP/status.txt"
          # A hand-edited domain reaches the proxy's configuration, so start
          # checks it as strictly as setup does.
          cp .env "$RUNNER_TEMP/env.good"
          sed -i 's/^DOMAIN=localhost$/DOMAIN=localhost {/' .env
          if sudo ./nullbin start; then exit 1; fi
          cp "$RUNNER_TEMP/env.good" .env
          echo 'DOMAIN=other.example.com' >> .env
          if sudo ./nullbin start; then exit 1; fi
          cp "$RUNNER_TEMP/env.good" .env
          # Compose also reads NAME: value, and a later line wins: a quoted
          # value spanning lines would add a site of its own to the proxy.
          printf "DOMAIN: 'localhost {\n  respond injected\n}\nhttp://placeholder.invalid'\n" >> .env
          if sudo ./nullbin start; then exit 1; fi
          cp "$RUNNER_TEMP/env.good" .env
          echo 'COMPOSE_PROJECT_NAME=other' >> .env
          if sudo ./nullbin status; then exit 1; fi
          cp "$RUNNER_TEMP/env.good" .env
          # Refuses anything that is not a release version or a paste ID.
          if sudo ./nullbin update main; then exit 1; fi
          if sudo ./nullbin delete not-an-id; then exit 1; fi
          if ./nullbin status; then exit 1; fi  # needs sudo
          if sudo ./nullbin setup other.example.com; then exit 1; fi  # already configured
          sudo ./nullbin cleanup
          curl -fsSk https://localhost/api/v1/version | grep -q '"version":"v9.9.9"'  # still running
          # The update raised the old default and kept the file private.
          grep -qx 'MAX_PENDING=1024' .env
          test "$(stat -c '%U %a' .env)" = "$(id -un) 600"
          test "$(docker network inspect nullbin_frontend --format '{{.EnableIPv6}}')" = true
      - name: IPv6 visitors keep their own address
        run: |
          set -x
          # A host address that is not loopback, as a visitor's would be.
          sudo ip link add nbtest6 type dummy
          sudo ip link set nbtest6 up
          sudo ip -6 addr add fd00:6e62::1/64 dev nbtest6 nodad
          cat > "$RUNNER_TEMP/peer.py" <<'PY'
          import http.server, socket
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(self.client_address[0].encode())
          class Server6(http.server.HTTPServer):
              address_family = socket.AF_INET6
          try:
              Server6(('::', 8080), Handler).serve_forever()
          except OSError:  # a container without IPv6
              http.server.HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
          PY
          # A probe on Nullbin's public network reports the client address it
          # sees, as Caddy would. Another on an IPv4-only network shows what
          # Nullbin saw before (for comparison only).
          docker run -d --name peer --network nullbin_frontend -p 8099:8080 \
            -v "$RUNNER_TEMP/peer.py:/peer.py:ro" python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca python /peer.py
          docker network create nbtest-v4only
          docker run -d --name peer4 --network nbtest-v4only -p 8098:8080 \
            -v "$RUNNER_TEMP/peer.py:/peer.py:ro" python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca python /peer.py
          for i in $(seq 1 30); do
            curl -s -6 -o /dev/null 'http://[fd00:6e62::1]:8099/' && break
            sleep 1
          done
          echo "IPv4-only network sees: $(curl -s -6 'http://[fd00:6e62::1]:8098/')"
          seen=$(curl -fsS -6 'http://[fd00:6e62::1]:8099/')
          echo "Nullbin's network sees: $seen"
          test "$seen" = fd00:6e62::1
          docker rm -f peer peer4
          docker network rm nbtest-v4only
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs --no-color

  deploy-api:
    name: Separate API deployment (HTTPS, CORS and isolation)
    # Runs the helper script as root: not for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start the separate API layout
        working-directory: deploy
        run: |
          sudo ./nullbin setup-api localhost https://paste.example.com
          VERSION=v0.0.0-ci docker compose --env-file .env.api -f compose.api.yaml up -d --build --wait --wait-timeout 300
          test "$(docker inspect nullbin-caddy-1 --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapAdd}}')" = "65532:65532 true []"
          if docker exec nullbin-caddy-1 sh -c true 2>/dev/null; then echo 'the proxy has a shell'; exit 1; fi
      - name: Check exact origins and real cross-origin writes
        run: |
          python3 - <<'PY'
          import json, ssl, urllib.request, urllib.error
          ctx = ssl._create_unverified_context()
          base = 'https://localhost'
          allowed = 'https://paste.example.com'
          def call(path, method='GET', data=None, headers=None):
              req = urllib.request.Request(base + path, data=data, headers=headers or {}, method=method)
              try:
                  return urllib.request.urlopen(req, context=ctx)
              except urllib.error.HTTPError as err:
                  return err
          assert call('/').status == 404
          assert call('/assets/app.js').status == 404
          version = json.load(call('/api/v1/version'))
          assert version == {'mode': 'api', 'version': 'v0.0.0-ci'}, version
          for origin, status in ((allowed, 204), ('https://evil.example', 403)):
              resp = call('/api/v1/pastes', 'OPTIONS', headers={
                  'Origin': origin, 'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type,nullbin-burn-token'})
              assert resp.status == status
              assert resp.headers.get('Access-Control-Allow-Origin') == (allowed if status == 204 else None)
          resp = call('/api/v1/pastes', 'POST', json.dumps({
              'expires_in': 300, 'burn_after_reading': False, 'total_size': 100}).encode(), {
                  'Origin': allowed, 'Sec-Fetch-Site': 'cross-site', 'Content-Type': 'application/json'})
          assert resp.status == 201
          assert resp.headers['Access-Control-Allow-Origin'] == allowed
          assert 'sandbox' in resp.headers['Content-Security-Policy']
          assert resp.headers.get('Access-Control-Allow-Credentials') is None
          assert call('/api/v1/pastes', 'POST', b'{}', {
              'Origin': 'https://evil.example', 'Sec-Fetch-Site': 'cross-site',
              'Content-Type': 'application/json'}).status == 403
          PY
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env.api -f compose.api.yaml logs --no-color

  deploy-cloudflare:
    name: Behind Cloudflare (client addresses, origin lockdown, certificate fallback)
    # Runs the helper script as root: not for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The trusted ranges are exactly Cloudflare's published ones
        run: |
          set -x
          { curl -fsS https://www.cloudflare.com/ips-v4; echo; curl -fsS https://www.cloudflare.com/ips-v6; echo; } |
            grep . | sort > "$RUNNER_TEMP/published.txt"
          # Both lists in the configuration: who may name a visitor, and who may connect.
          for directive in 'trusted_proxies static' '@not-cloudflare not remote_ip'; do
            grep -F "$directive" deploy/caddy/cf-ranges.caddy | sed "s/.*$directive //" | tr ' ' '\n' | grep . | sort > "$RUNNER_TEMP/configured.txt"
            diff "$RUNNER_TEMP/published.txt" "$RUNNER_TEMP/configured.txt"
          done
      - name: Set up and start in Cloudflare mode with the helper script
        working-directory: deploy
        run: |
          set -x
          sudo ./nullbin setup nullbin.test --cloudflare
          grep -qx 'CLOUDFLARE=true' .env
          sudo ./nullbin start | tee "$RUNNER_TEMP/start.txt"
          grep -q 'Cloudflare mode is on' "$RUNNER_TEMP/start.txt"
          docker inspect nullbin-caddy-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'CLOUDFLARE=true'
      - name: Let's Encrypt cannot issue for this name, so Caddy uses its own certificate
        working-directory: deploy
        run: |
          set -x
          for i in $(seq 1 60); do
            issuer=$(openssl s_client -connect 127.0.0.1:443 -servername nullbin.test </dev/null 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null || true)
            [ -n "$issuer" ] && break
            sleep 2
          done
          echo "$issuer" | grep -q 'Caddy Local Authority'
          sudo ./nullbin cloudflare | tee "$RUNNER_TEMP/cf.txt"
          grep -q "Certificate:     Caddy's own" "$RUNNER_TEMP/cf.txt"
          grep -q 'set SSL/TLS encryption to: Full (not Full (strict)' "$RUNNER_TEMP/cf.txt"
      - name: Only Cloudflare reaches the site, and only it can name the visitor
        run: |
          set -x
          # From this host (not a Cloudflare address): refused, header or not.
          test "$(curl -sk -o /dev/null -w '%{http_code}' --resolve nullbin.test:443:127.0.0.1 https://nullbin.test/)" = 403
          test "$(curl -sk -o /dev/null -w '%{http_code}' --resolve nullbin.test:443:127.0.0.1 -H 'CF-Connecting-IP: 1.2.3.4' https://nullbin.test/api/v1/version)" = 403
          # A client on one of Cloudflare's own ranges stands in for Cloudflare;
          # another on an ordinary network for anyone else.
          docker network create --subnet 173.245.48.0/24 nbtest-cf
          docker network create --subnet 10.99.0.0/24 nbtest-other
          docker network connect --alias nullbin.test nbtest-cf nullbin-caddy-1
          docker network connect --alias nullbin.test nbtest-other nullbin-caddy-1
          cat > "$RUNNER_TEMP/client.py" <<'PY'
          import json, os, ssl, sys, urllib.request, urllib.error
          ctx = ssl._create_unverified_context()
          def call(path, method='GET', data=None, headers=None):
              req = urllib.request.Request('https://nullbin.test' + path, data=data, headers=headers or {}, method=method)
              try:
                  r = urllib.request.urlopen(req, context=ctx, timeout=30)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          def ip():
              return '198.51.%d.%d' % (os.urandom(1)[0], os.urandom(1)[0] or 1)
          def create(headers):
              body = json.dumps({'expires_in': 300, 'burn_after_reading': False, 'total_size': 100}).encode()
              return call('/api/v1/pastes', 'POST', body, {'Content-Type': 'application/json', **headers})[0]
          if sys.argv[1] == 'other':
              status, body = call('/')
              assert status == 403 and b'only through Cloudflare' in body, status
              assert call('/', headers={'CF-Connecting-IP': '1.2.3.4'})[0] == 403
              assert create({}) == 403
          else:
              assert call('/')[0] == 200
              codes = [create({'CF-Connecting-IP': ip()}) for _ in range(30)]
              assert set(codes) == {201}, codes  # every visitor has limits of its own
              one = ip()
              codes = [create({'CF-Connecting-IP': one}) for _ in range(30)]
              assert {429, 503} & set(codes), codes  # one visitor is still limited
              one = ip()
              codes = [create({'CF-Connecting-IP': one, 'X-Forwarded-For': ip()}) for _ in range(30)]
              assert {429, 503} & set(codes), codes  # X-Forwarded-For changes nothing
          print(sys.argv[1], 'OK')
          PY
          PY_IMAGE=python:3.13-alpine@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
          docker run --rm --network nbtest-cf --ip 173.245.48.10 -v "$RUNNER_TEMP/client.py:/client.py:ro" "$PY_IMAGE" python /client.py cloudflare
          docker run --rm --network nbtest-other --ip 10.99.0.10 -v "$RUNNER_TEMP/client.py:/client.py:ro" "$PY_IMAGE" python /client.py other
          docker network disconnect nbtest-cf nullbin-caddy-1
          docker network disconnect nbtest-other nullbin-caddy-1
          docker network rm nbtest-cf nbtest-other
      - name: The setting is checked, and the helper turns it off
        working-directory: deploy
        run: |
          set -x
          cp .env "$RUNNER_TEMP/env.good"
          sed -i 's/^CLOUDFLARE=true$/CLOUDFLARE=yes/' .env
          if sudo ./nullbin start; then exit 1; fi
          cp "$RUNNER_TEMP/env.good" .env
          echo 'CLOUDFLARE=false' >> .env
          if sudo ./nullbin start; then exit 1; fi
          cp "$RUNNER_TEMP/env.good" .env
          # A value in the shell never overrides the checked file.
          sudo CLOUDFLARE=false ./nullbin start
          docker inspect nullbin-caddy-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'CLOUDFLARE=true'
          sudo ./nullbin cloudflare off
          if grep -q '^CLOUDFLARE=' .env; then exit 1; fi
          test "$(stat -c '%U %a' .env)" = "$(id -un) 600"
          docker inspect nullbin-caddy-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'CLOUDFLARE=false'
          sudo ./nullbin cloudflare on
          grep -qx 'CLOUDFLARE=true' .env
      - name: Self-signed mode never contacts Let's Encrypt
        working-directory: deploy
        run: |
          set -x
          sudo ./nullbin cloudflare self-signed | tee "$RUNNER_TEMP/self.txt"
          grep -qx 'CLOUDFLARE=self-signed' .env
          docker inspect nullbin-caddy-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'CLOUDFLARE=self-signed'
          grep -q 'Cloudflare mode: on, self-signed' "$RUNNER_TEMP/self.txt"
          for i in $(seq 1 30); do
            sudo ./nullbin cloudflare > "$RUNNER_TEMP/self.txt"
            grep -q "Certificate:     Caddy's own (self-signed)" "$RUNNER_TEMP/self.txt" && break
            sleep 2
          done
          grep -q "Certificate:     Caddy's own (self-signed)" "$RUNNER_TEMP/self.txt"
          grep -q 'Let.s Encrypt is never used' "$RUNNER_TEMP/self.txt"
          # The recreated proxy never asked an ACME server for anything.
          if docker logs nullbin-caddy-1 2>&1 | grep -qiE 'acme-v02|letsencrypt'; then exit 1; fi
          # Still locked to Cloudflare.
          test "$(curl -sk -o /dev/null -w '%{http_code}' --resolve nullbin.test:443:127.0.0.1 https://nullbin.test/)" = 403
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs --no-color

  arm64:
    name: arm64 cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build arm64 artifacts and check the binary's architecture
        run: |
          docker build --platform linux/arm64 --target artifacts --output type=local,dest=out .
          file out/nullbin | tee /dev/stderr | grep -q 'ARM aarch64'

  # The cross-build above runs on x86. On an ARM server (Ampere, Graviton)
  # everything runs natively instead: Node and Go build inside arm64 images,
  # and Caddy and Nullbin run as arm64 containers. This job does exactly what
  # an operator does there, on a native arm64 runner.
  arm64-native:
    name: Native arm64 server (tests, build, start, HTTPS round trip)
    # Runs the helper script as root: not for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go test -race (arm64)
        run: |
          test "$(go env GOARCH)" = arm64
          go test -race -count=1 ./...
          go test -tags=api -race -count=1 ./...
      - name: Set up and start with the helper script, as on an ARM server
        working-directory: deploy
        run: |
          sudo ./nullbin setup localhost
          sudo ./nullbin start
          # Both images were built for, and run as, arm64.
          for image in nullbin-api:local nullbin-frontend:local; do
            test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          done
          test "$(docker inspect nullbin-nullbin-1 --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.State.Health.Status}}')" = "65532:65532 true healthy"
          test "$(docker inspect nullbin-caddy-1 --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}}')" = "65532:65532 true"
      - name: HTTPS round trip through Caddy (page, paste, burn after reading)
        run: |
          python3 - <<'PY'
          import json, os, ssl, urllib.request, urllib.error
          ctx = ssl._create_unverified_context()
          def call(path, method='GET', data=None, headers=None):
              req = urllib.request.Request('https://localhost' + path, data=data, headers=headers or {}, method=method)
              try:
                  return urllib.request.urlopen(req, context=ctx)
              except urllib.error.HTTPError as err:
                  return err
          page = call('/')
          assert page.status == 200 and "default-src 'none'" in page.headers['Content-Security-Policy']
          assert b'integrity="sha256-' in page.read()
          def publish(**extra):
              body = {'expires_in': 300, 'burn_after_reading': False, 'total_size': 100, **extra}
              resp = call('/api/v1/pastes', 'POST', json.dumps(body).encode(), {'Content-Type': 'application/json'})
              assert resp.status == 201, resp.status
              c = json.load(resp)
              blob = os.urandom(100)
              up = {'Nullbin-Upload-Token': c['upload_token']}
              assert call(f"/api/v1/pastes/{c['id']}/chunks/0", 'PUT', blob, {**up, 'Content-Type': 'application/octet-stream'}).status == 204
              assert call(f"/api/v1/pastes/{c['id']}/finalize", 'POST', b'', up).status == 200
              return c['id'], blob
          pid, blob = publish()
          resp = call(f'/api/v1/pastes/{pid}')
          assert resp.status == 200 and resp.read() == blob
          burn = 'A' * 43
          pid, blob = publish(burn_after_reading=True, burn_token=burn)
          read = lambda: call(f'/api/v1/pastes/{pid}/read', 'POST', b'', {'Nullbin-Burn-Token': burn})
          resp = read()
          assert resp.status == 200 and resp.read() == blob
          assert read().status == 404, 'a burn paste was served twice'
          print('arm64 round trip OK')
          PY
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs --no-color
